# yaml-language-server: $schema=./fieldmapping.schema.json
apiVersion: translation.opi.nvidia.com/v1alpha1
kind: FieldMapping
metadata:
  name: dataprocessingunit
  description: |
    One OPI DataProcessingUnit expands into the DPF objects a DPU cannot
    exist without. Direct copies are JSONPath; everything DPF requires
    that OPI does not have is a CEL expression or a literal default.
    Serial numbers are not invented. cmd/vsp stamps them as annotations
    after enumerating hardware (mock locally, PCI on a real worker).
source:
  group: config.openshift.io
  version: v1
  kind: DataProcessingUnit
# Preserve provisioned hardware while inventory is missing or ineligible.
# Explicit source deletion still runs finalizer cleanup.
pruneWhen: "source.spec.?dpuProductName.orValue('') == 'BlueField-3' && source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == 'BlueField-3'"
# Emitted children land in the source namespace, or dpf-operator-system when
# the source is cluster-scoped. Declared once here instead of on every emit.
defaults:
  namespace:
    cel: "source.metadata.?namespace.orValue('') != '' ? source.metadata.namespace : 'dpf-operator-system'"
emit:
  - target:
      group: provisioning.dpu.nvidia.com
      version: v1alpha1
      kind: DPUDevice
    # DPF 26.4 profile: require matching requested and observed BF3 generation.
    # BF2 remains discoverable but cannot enter this provisioning profile.
    # Missing inventory fails closed rather than defaulting to BlueField.
    when: "source.spec.?dpuProductName.orValue('') == 'BlueField-3' && source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == 'BlueField-3'"
    # DPF hostagent names DPUDevice as lower(serial). A different name
    # (source-name + '-device') creates a second object that the webhook
    # rejects as a duplicate serial, and DPUNode never appears.
    name:
      cel: "source.metadata.?annotations['provisioning.dpu.nvidia.com/serial-number'].orValue(source.metadata.name + '-device').lowerAscii()"
    fields:
      - to: spec.serialNumber
        cel: "source.metadata.?annotations['provisioning.dpu.nvidia.com/serial-number'].orValue('')"
        required: true

  - target:
      group: provisioning.dpu.nvidia.com
      version: v1alpha1
      kind: DPUFlavor
    when: "source.spec.?dpuProductName.orValue('') == 'BlueField-3' && source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == 'BlueField-3'"
    name:
      cel: "source.metadata.?annotations['dpu.nvidia.com/flavor'].orValue('dpf-default-flavor')"
    fields:
      - to: spec.dpuMode
        value: dpu
      # Official DPF 26.4.0 HBN defaults
      # (https://networking-docs.nvidia.com/dpf/26.4.0/dpuflavor).
      # A value that differs from running firmware sets reset_needed and
      # leaves the DPU in Rebooting until a host power cycle. Annotations
      # override one parameter so a recreated DPUFlavor can match the card.
      # SF 0 is rejected (that was the dh2 stall) and falls back to 20/10.
      # Other parameters keep an explicit 0. Flavor spec is immutable —
      # this applies to new/recreated DPUFlavor objects only.
      - to: spec.nvconfig
        cel: |
          [{
            "device": "*",
            "parameters": [
              "PF_BAR2_ENABLE=" + source.metadata.?annotations['dpu.nvidia.com/pf-bar2-enable'].orValue('0'),
              "PER_PF_NUM_SF=" + source.metadata.?annotations['dpu.nvidia.com/per-pf-num-sf'].orValue('1'),
              "PF_TOTAL_SF=" + (source.metadata.?annotations['dpu.nvidia.com/pf-total-sf'].orValue('20') == '0' ? '20' : source.metadata.?annotations['dpu.nvidia.com/pf-total-sf'].orValue('20')),
              "PF_SF_BAR_SIZE=" + (source.metadata.?annotations['dpu.nvidia.com/pf-sf-bar-size'].orValue('10') == '0' ? '10' : source.metadata.?annotations['dpu.nvidia.com/pf-sf-bar-size'].orValue('10')),
              "NUM_PF_MSIX_VALID=" + source.metadata.?annotations['dpu.nvidia.com/num-pf-msix-valid'].orValue('0'),
              "PF_NUM_PF_MSIX_VALID=" + source.metadata.?annotations['dpu.nvidia.com/pf-num-pf-msix-valid'].orValue('1'),
              "PF_NUM_PF_MSIX=" + source.metadata.?annotations['dpu.nvidia.com/pf-num-pf-msix'].orValue('228'),
              "INTERNAL_CPU_MODEL=1",
              "INTERNAL_CPU_OFFLOAD_ENGINE=0",
              "SRIOV_EN=1",
              "NUM_OF_VFS=" + source.metadata.?annotations['dpu.nvidia.com/num-of-vfs'].orValue('46'),
              "LAG_RESOURCE_ALLOCATION=" + source.metadata.?annotations['dpu.nvidia.com/lag-resource-allocation'].orValue('1')
            ]
          }]

  - target:
      group: provisioning.dpu.nvidia.com
      version: v1alpha1
      kind: BFB
    when: "source.spec.?dpuProductName.orValue('') == 'BlueField-3' && source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == 'BlueField-3'"
    name:
      cel: "source.metadata.?annotations['dpu.nvidia.com/bfb'].orValue('bf-bundle')"
    fields:
      - to: spec.url
        cel: "source.metadata.?annotations['dpu.nvidia.com/bfb-url'].orValue('')"
        required: true

  - target:
      group: provisioning.dpu.nvidia.com
      version: v1alpha1
      kind: DPU
    when: "source.spec.?dpuProductName.orValue('') == 'BlueField-3' && source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == 'BlueField-3'"
    name:
      from: metadata.name
    fields:
      # 1:1 JSONPath copies
      - to: spec.dpuNodeName
        from: spec.nodeName
        required: true
      # DPF host-agent and DPUNode controllers select DPUs by this label.
      - to: metadata.labels
        cel: "{'provisioning.dpu.nvidia.com/dpunode-name': source.spec.nodeName}"
      # Required DPF fields with no OPI counterpart — defaults / annotations
      - to: spec.dpuDeviceName
        cel: "source.metadata.?annotations['provisioning.dpu.nvidia.com/serial-number'].orValue(source.metadata.name + '-device').lowerAscii()"
      - to: spec.dpuFlavor
        cel: "source.metadata.?annotations['dpu.nvidia.com/flavor'].orValue('dpf-default-flavor')"
      # DPU.spec.bfb is a string (the BFB CR name), not an object.
      - to: spec.bfb
        cel: "source.metadata.?annotations['dpu.nvidia.com/bfb'].orValue('bf-bundle')"
      - to: spec.serialNumber
        cel: "source.metadata.?annotations['provisioning.dpu.nvidia.com/serial-number'].orValue('')"
        required: true
      # DPF hostAgent install requires spec.pciAddress (0000-0f-00 form).
      - to: spec.pciAddress
        cel: "source.metadata.?annotations['provisioning.dpu.nvidia.com/pci-address'].orValue('')"
        required: true
      # Literal default: noEffect is the safe local-dev default (no host drain,
      # no taint). This is a plain value, not a CEL-enforced constraint.
      - to: spec.nodeEffect.noEffect
        value: true

# Mirror the emitted children's readiness back onto the DataProcessingUnit.
# The DataProcessingUnit CRD status schema defines conditions[] (metav1), so a
# condition mirrors cleanly; custom scalar status fields would be pruned by the
# apiserver and are intentionally omitted.
#
# Single-writer status model: this condition is DPFReady, NOT Ready. The
# per-node dpu-operator daemon owns Ready on this very object -- it seeds it in
# internal/platform/vendordetector.go and updates it from plugin-init plus VSP
# ping in internal/daemon/daemon.go. Two controllers patching one condition type
# would flap it on every reconcile, and Ready is also the CRD's printer column,
# so losing that race shows a working card as not ready. The translation
# controller therefore owns exactly one vendor-scoped condition and never
# touches the daemon's. amd-dsc200.yaml does the same with DSCReady.
#
# Readiness contract: DPFReady is True only when every child is actually
# ready. NVIDIA DPU/BFB publish status.phase (Ready / OS Installing / …)
# and typed conditions like OSInstalled — they do not set type=Ready.
# Requiring type=Ready left DPFReady=False after a successful provision.
# DPUFlavor has no phase and no conditions and stays non-blocking.
# phase=OS Installing / Initializing / Rebooting is not Ready.
status:
  # Own NVIDIA compatibility reporting even when provisioning is blocked.
  # Foreign vendors without observed BlueField inventory remain untouched.
  when: "(source.spec.?dpuProductName.orValue('').startsWith('BlueField') || source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('').startsWith('BlueField')) || source.metadata.?annotations['provisioning.dpu.nvidia.com/serial-number'].orValue('') != '' || source.?status.?conditions.orValue([]).exists(c, c.type in ['DPFReady', 'DPFHardwareCompatible'])"
  # DataProcessingUnit CRD declares status.conditions; DPFReady is stored.
  # Ready and its schema fields (lastTransitionTime, observedGeneration) stay.
  schema: conditions
  conditions:
    - type: DPFReady
      status: "(source.spec.?dpuProductName.orValue('') == 'BlueField-3' && source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == 'BlueField-3') && (children.size() > 0 && children.all(c, c.?status.?conditions.orValue([]).exists(cond, cond.type == 'Ready' && cond.status == 'True') || c.?status.?phase.orValue('') == 'Ready' || c.?kind.orValue('') == 'DPUFlavor'))"
      reason: "!(source.spec.?dpuProductName.orValue('') == 'BlueField-3' && source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == 'BlueField-3') ? (source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == '' ? 'HardwareIdentityMissing' : (source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') != 'BlueField-3' ? 'UnsupportedHardware' : (source.spec.?dpuProductName.orValue('') != 'BlueField-3' ? 'HardwareIdentityMismatch' : 'SupportedGeneration'))) : (children.exists(c, c.?status.?phase.orValue('') == 'Rebooting') ? 'Rebooting' : ((children.size() > 0 && children.all(c, c.?status.?conditions.orValue([]).exists(cond, cond.type == 'Ready' && cond.status == 'True') || c.?status.?phase.orValue('') == 'Ready' || c.?kind.orValue('') == 'DPUFlavor')) ? 'AllChildrenReady' : 'ChildrenNotReady'))"
      message: "!(source.spec.?dpuProductName.orValue('') == 'BlueField-3' && source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == 'BlueField-3') ? ((source.spec.?dpuProductName.orValue('') == 'BlueField-3' && source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == 'BlueField-3') ? 'BlueField-3 generation is eligible for the DPF 26.4 profile; verify exact SKU, firmware, host OS and physical dataplane separately' : ('DPF 26.4 profile requires matching declared and observed BlueField-3 hardware; observed=' + source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue(''))) : (children.exists(c, c.?status.?phase.orValue('') == 'Rebooting') ? 'NVIDIA DPU child is Rebooting; the required reset is managed by DPF' : ((children.size() > 0 && children.all(c, c.?status.?conditions.orValue([]).exists(cond, cond.type == 'Ready' && cond.status == 'True') || c.?status.?phase.orValue('') == 'Ready' || c.?kind.orValue('') == 'DPUFlavor')) ? 'All emitted DPF objects report Ready' : 'One or more emitted DPF resources are not Ready'))"
    # Generation eligibility is separate from inventory and runtime readiness.
    - type: DPFHardwareCompatible
      status: "source.spec.?dpuProductName.orValue('') == 'BlueField-3' && source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == 'BlueField-3'"
      reason: "source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == '' ? 'HardwareIdentityMissing' : (source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') != 'BlueField-3' ? 'UnsupportedHardware' : (source.spec.?dpuProductName.orValue('') != 'BlueField-3' ? 'HardwareIdentityMismatch' : 'SupportedGeneration'))"
      message: "(source.spec.?dpuProductName.orValue('') == 'BlueField-3' && source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue('') == 'BlueField-3') ? 'BlueField-3 generation is eligible for the DPF 26.4 profile; verify exact SKU, firmware, host OS and physical dataplane separately' : ('DPF 26.4 profile requires matching declared and observed BlueField-3 hardware; observed=' + source.metadata.?annotations['discovery.opiproject.org/product-name'].orValue(''))"
