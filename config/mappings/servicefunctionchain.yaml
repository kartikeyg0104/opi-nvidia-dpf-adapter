apiVersion: translation.opi.nvidia.com/v1alpha1
kind: FieldMapping
metadata:
  name: servicefunctionchain
  description: |
    Each NetworkFunction with a Helm chart becomes a DPUService.
    Image-only network functions are skipped: DPF has no field that
    accepts a bare container image. That is the image-versus-chart
    mismatch; the OPI API upgrade (Chart *HelmChartSource) is the
    source side of this mapping.
source:
  group: config.openshift.io
  version: v1
  kind: ServiceFunctionChain
defaults:
  namespace:
    cel: "source.metadata.?namespace.orValue('') != '' ? source.metadata.namespace : 'dpf-operator-system'"
emit:
  - target:
      group: svc.dpu.nvidia.com
      version: v1alpha1
      kind: DPUService
    forEach:
      in: spec.networkFunctions
    when: "'chart' in item"
    name:
      cel: "item.name"
    fields:
      - to: spec.serviceID
        from: item.name
        required: true
      - to: spec.helmChart.source.repoURL
        cel: "item.chart.repository"
        required: true
      - to: spec.helmChart.source.version
        cel: "item.chart.version"
        required: true
      - to: spec.paused
        value: false
      # DPF CEL: security.privileged must be set when deployInCluster is
      # false (the default). NVIDIA DPUServices run on the DPU.
      - to: spec.security.privileged
        value: true

# Mirror DPUService readiness back onto the ServiceFunctionChain.
#
# NOTE: the current ServiceFunctionChain CRD (dpu-operator) declares an empty
# status object, so the apiserver prunes everything written here -- this mirror
# is a no-op until that CRD gains a status schema with conditions[]. The rule
# is kept so mirroring activates automatically once the upstream schema lands;
# the conformance suite asserts GC/owner-refs for this source, not status.
status:
  conditions:
    - type: Ready
      status: "children.size() > 0 && children.all(c, c.?status.?conditions.orValue([]).size() == 0 || c.?status.?conditions.orValue([]).exists(cond, cond.type == 'Ready' && cond.status == 'True'))"
      reason: AllServicesReady
      message: "All translated DPUServices report Ready"
