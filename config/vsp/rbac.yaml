---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvidia-vsp
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nvidia-vsp-role
rules:
- apiGroups:
  - config.openshift.io
  resources:
  - dataprocessingunits
  verbs:
  - get
  - list
  - watch
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvidia-vsp-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nvidia-vsp-role
subjects:
- kind: ServiceAccount
  name: nvidia-vsp
  namespace: system
