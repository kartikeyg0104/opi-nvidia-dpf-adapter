# Real BlueField: PCI scan, host /sys, socket where the OPI daemon dials.
# Enroll verified hardware first; see docs/hardware-profiles.md.
# Kind keeps using config/default (mock serial). On lab hardware:
#   kubectl apply -k config/overlays/hardware-vsp
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opi-nvidia-dpf-adapter-system
namePrefix: opi-nvidia-dpf-adapter-
resources:
- ../../vsp
patches:
- path: pci-patch.yaml
  target:
    kind: DaemonSet
    name: nvidia-vsp
images:
- name: controller
  newName: controller
  newTag: latest
