---
# STUB SCHEMA -- not an AMD-published CRD.
#
# Modelled on the AMD Pensando DSC2-100 observed on lab host dh1
# (PCI vendor 0x1dd8, ionic driver, VPD product "Pensando DSC2-100 100G
# 2p QSFP56 DPU"). It exists so the conformance suite can prove the
# CEL/JSONPath engine emits a second vendor's CRs without Go changes.
#
# Replace with the real CRDs from the AMD DSC operator when they are
# pulled off dh1 -- see docs/multi-vendor.md for the exact fetch list.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    opi.nvidia.com/stub: "true"
  name: dscdevices.dpu.amd.com
spec:
  group: dpu.amd.com
  names:
    kind: DSCDevice
    listKind: DSCDeviceList
    plural: dscdevices
    singular: dscdevice
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DSCDevice is one physical AMD Pensando DSC card.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              deviceSerial:
                description: Board serial number, from PCI VPD keyword SN.
                type: string
              pciAddress:
                description: PCIe address of the card's management function.
                type: string
              productName:
                description: Vendor and model name, e.g. DSC2-100.
                type: string
              management:
                properties:
                  driver:
                    description: Host driver bound to the management function.
                    type: string
                  interface:
                    description: Management path, oob or inband.
                    type: string
                type: object
            required:
            - deviceSerial
            type: object
          status:
            properties:
              conditions:
                description: Conditions published by the AMD DSC operator.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
