---
# STUB SCHEMA -- not an AMD-published CRD.
#
# Modelled on the AMD Pensando DSC2-100 observed on lab host dh1
# (PCI vendor 0x1dd8, ionic driver, VPD product "Pensando DSC2-100 100G
# 2p QSFP56 DPU"). It exists so the conformance suite can prove the
# CEL/JSONPath engine emits a second vendor's CRs without Go changes.
#
# Replace with the real CRDs from the AMD DSC operator when they are
# pulled off dh1 -- see docs/multi-vendor.md for the exact fetch list.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    opi.nvidia.com/stub: "true"
  name: dscprofiles.dpu.amd.com
spec:
  group: dpu.amd.com
  names:
    kind: DSCProfile
    listKind: DSCProfileList
    plural: dscprofiles
    singular: dscprofile
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DSCProfile is the forwarding/personality profile applied to a DSC.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              mode:
                description: Card personality, smartnic (host-managed) or dpu.
                enum:
                - smartnic
                - dpu
                type: string
              hostInterfaces:
                description: Number of host-facing ethernet interfaces to expose.
                type: integer
            type: object
        type: object
    served: true
    storage: true
