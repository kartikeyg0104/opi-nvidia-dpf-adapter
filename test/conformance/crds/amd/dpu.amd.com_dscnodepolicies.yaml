---
# STUB SCHEMA -- not an AMD-published CRD.
#
# Modelled on the AMD Pensando DSC2-100 observed on lab host dh1
# (PCI vendor 0x1dd8, ionic driver, VPD product "Pensando DSC2-100 100G
# 2p QSFP56 DPU"). It exists so the conformance suite can prove the
# CEL/JSONPath engine emits a second vendor's CRs without Go changes.
#
# Replace with the real CRDs from the AMD DSC operator when they are
# pulled off dh1 -- see docs/multi-vendor.md for the exact fetch list.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    opi.nvidia.com/stub: "true"
  name: dscnodepolicies.dpu.amd.com
spec:
  group: dpu.amd.com
  names:
    kind: DSCNodePolicy
    listKind: DSCNodePolicyList
    plural: dscnodepolicies
    singular: dscnodepolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DSCNodePolicy binds a DSCDevice, DSCProfile and DSCFirmware to one node.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              nodeName:
                type: string
              deviceRef:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              profileRef:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              firmwareRef:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              drain:
                description: Host drain policy. Inverted sense vs DPU.spec.nodeEffect.noEffect.
                properties:
                  enabled:
                    type: boolean
                type: object
            required:
            - nodeName
            type: object
          status:
            properties:
              conditions:
                description: Conditions published by the AMD DSC operator.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
